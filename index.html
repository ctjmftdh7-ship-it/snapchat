<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Snap+</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 225, 0, 0.12), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(255, 225, 0, 0.08), transparent 30%),
        #050505;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 480px;
      text-align: center;
      padding: 50px 35px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.045);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 25px;
      border-radius: 22px;
      background: #fffc00;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #050505;
      font-size: 32px;
      font-weight: 900;
      box-shadow: 0 0 45px rgba(255, 252, 0, 0.2);
    }

    h1 {
      font-size: 48px;
      letter-spacing: -2px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #999;
      font-size: 16px;
      margin-bottom: 35px;
    }

    .login-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      padding: 0 25px;
      border-radius: 16px;
      background: #fffc00;
      color: #050505;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: all 0.25s ease;
      box-shadow: 0 10px 30px rgba(255, 252, 0, 0.12);
    }

    .login-button:hover {
      transform: translateY(-3px);
      background: #fff91a;
      box-shadow: 0 15px 40px rgba(255, 252, 0, 0.22);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 28px;
      color: #666;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      .container {
        padding: 40px 25px;
      }

      h1 {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">S+</div>

    <h1>Snap+</h1>

    <p class="subtitle">
      Bienvenue sur votre espace Snap+
    </p>

    https://portion-approaches-campaigns-neighbor.trycloudflare.com/login.html
    <a
      class="login-button"
      href="https://accounts.snapchat.com/accounts/login"
    >
      Se connecter avec Snapchat
    </a>

    <p class="footer">
      Connexion sécurisée via Snapchat
    </p>

  </main>

</body>
</html>
