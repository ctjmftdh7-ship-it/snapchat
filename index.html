<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DOXOUTILS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #050509;
    --purple: #7c5cff;
    --purple-light: #a78bfa;
    --cyan: #4fe0c5;
    --white: #ffffff;
    --muted: #9296a8;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: var(--bg);
    color: var(--white);
    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    overflow: hidden;
}

/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -5;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(124, 92, 255, .20),
            transparent 32%
        ),
        radial-gradient(
            circle at 80% 75%,
            rgba(79, 224, 197, .13),
            transparent 35%
        ),
        #050509;
}

.glow {
    position: absolute;
    width: 500px;
    height: 500px;

    border-radius: 50%;

    filter: blur(100px);

    opacity: .22;

    animation: float 10s ease-in-out infinite alternate;
}

.glow.one {
    top: -200px;
    left: -150px;
    background: var(--purple);
}

.glow.two {
    right: -200px;
    bottom: -200px;
    background: var(--cyan);

    animation-delay: -4s;
}

@keyframes float {
    from {
        transform: translate(0, 0) scale(1);
    }

    to {
        transform: translate(80px, 50px) scale(1.15);
    }
}

/* =========================
   GRID
========================= */

.grid {
    position: fixed;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size: 70px 70px;

    mask-image:
        radial-gradient(
            ellipse at center,
            black 0%,
            transparent 72%
        );

    -webkit-mask-image:
        radial-gradient(
            ellipse at center,
            black 0%,
            transparent 72%
        );
}

/* =========================
   PARTICLES
========================= */

.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    background: rgba(255,255,255,.55);

    border-radius: 50%;

    box-shadow:
        0 0 10px rgba(124,92,255,.8);

    animation:
        particleMove linear infinite,
        particleOpacity ease-in-out infinite alternate;
}

@keyframes particleMove {
    from {
        transform: translateY(110vh);
    }

    to {
        transform: translateY(-10vh);
    }
}

@keyframes particleOpacity {
    from {
        opacity: .15;
    }

    to {
        opacity: .8;
    }
}

/* =========================
   MAIN
========================= */

.container {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;
}

.card {
    position: relative;

    width: min(720px, 100%);

    padding: 65px 45px;

    text-align: center;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.015)
        );

    backdrop-filter: blur(22px);

    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.07);

    animation:
        cardAppear 1s
        cubic-bezier(.16,1,.3,1);
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform:
            translateY(35px)
            scale(.96);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* =========================
   STATUS
========================= */

.status {
    display: inline-flex;

    align-items: center;
    gap: 9px;

    padding: 8px 15px;

    margin-bottom: 25px;

    border-radius: 999px;

    border: 1px solid rgba(255,255,255,.07);

    background: rgba(255,255,255,.035);

    color: #a7abba;

    font-size: .78rem;

    letter-spacing: .04em;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--cyan);

    box-shadow:
        0 0 12px var(--cyan);

    animation: statusPulse 1.8s infinite;
}

@keyframes statusPulse {
    0%, 100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .35;
        transform: scale(.7);
    }
}

/* =========================
   TITLE
========================= */

h1 {
    font-size: clamp(
        3.4rem,
        10vw,
        6.5rem
    );

    font-weight: 900;

    letter-spacing: -.055em;

    line-height: .95;

    background:
        linear-gradient(
            135deg,
            #ffffff 15%,
            #d6d0ff 45%,
            var(--purple) 80%
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    text-shadow:
        0 0 60px rgba(124,92,255,.12);

    animation:
        titleAppear 1.2s
        cubic-bezier(.16,1,.3,1);
}

@keyframes titleAppear {
    from {
        opacity: 0;
        letter-spacing: .05em;
        filter: blur(10px);
    }

    to {
        opacity: 1;
        letter-spacing: -.055em;
        filter: blur(0);
    }
}

/* =========================
   DESCRIPTION
========================= */

.description {
    max-width: 570px;

    margin: 28px auto 32px;

    color: var(--muted);

    font-size: 1.02rem;

    line-height: 1.75;
}

/* =========================
   DISCORD BUTTON
========================= */

.discord {
    position: relative;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    padding: 16px 27px;

    color: #08080d;

    background: #ffffff;

    border-radius: 14px;

    text-decoration: none;

    font-size: .98rem;

    font-weight: 700;

    overflow: hidden;

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.discord::before {
    content: "";

    position: absolute;

    inset: -3px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(124,92,255,.75),
            transparent
        );

    transform:
        translateX(-120%);

    transition:
        transform .7s ease;
}

.discord:hover::before {
    transform:
        translateX(120%);
}

.discord:hover {
    transform: translateY(-4px);

    box-shadow:
        0 18px 50px
        rgba(124,92,255,.45),
        0 0 0 1px
        rgba(255,255,255,.15);
}

.discord svg {
    position: relative;
    z-index: 1;

    width: 21px;
    height: 21px;
}

.discord span {
    position: relative;
    z-index: 1;
}

/* =========================
   AVAILABILITY
========================= */

.availability {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    margin-top: 24px;

    color: #85899a;

    font-size: .8rem;

    animation:
        fadeUp 1s .6s both;
}

.availability strong {
    color: var(--cyan);

    font-weight: 600;

    text-shadow:
        0 0 12px
        rgba(79,224,197,.45);
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   FOOTER
========================= */

footer {
    position: fixed;

    bottom: 20px;

    left: 0;
    right: 0;

    text-align: center;

    color: #686c7c;

    font-size: .7rem;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .card {
        padding: 45px 22px;

        border-radius: 24px;
    }

    .description {
        font-size: .94rem;
    }

    .discord {
        width: 100%;
        max-width: 330px;
    }

    footer {
        bottom: 12px;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
</div>

<div class="grid"></div>

<div class="particles">

    <div class="particle" style="left:8%;animation-duration:12s;"></div>
    <div class="particle" style="left:18%;animation-duration:17s;"></div>
    <div class="particle" style="left:27%;animation-duration:14s;"></div>
    <div class="particle" style="left:38%;animation-duration:19s;"></div>
    <div class="particle" style="left:49%;animation-duration:13s;"></div>
    <div class="particle" style="left:61%;animation-duration:18s;"></div>
    <div class="particle" style="left:72%;animation-duration:15s;"></div>
    <div class="particle" style="left:84%;animation-duration:20s;"></div>
    <div class="particle" style="left:94%;animation-duration:16s;"></div>

</div>

<main class="container">

    <section class="card">

        <div class="status">

        </p>

        <a

            <span>

        </a>

        <div class="availability">

    </section>

</main>

<footer>
    DOXOUTILS — Tous droits réservés
</footer>

</body>
</html>
