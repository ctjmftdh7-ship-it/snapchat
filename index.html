<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Premium+</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      background:
        radial-gradient(circle at top, #3a3a3a 0%, #111 45%, #050505 100%);
      color: white;
    }

    .background-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      filter: blur(80px);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(90%, 430px);
      padding: 45px 30px;
      text-align: center;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 70px;
      height: 70px;

      margin-bottom: 25px;

      border-radius: 22px;

      background: white;
      color: black;

      font-size: 36px;
      font-weight: bold;

      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.12);
    }

    h1 {
      font-size: clamp(32px, 8vw, 46px);
      letter-spacing: -1.5px;
      margin-bottom: 14px;
    }

    h1 span {
      display: inline-block;
      margin-left: 3px;
    }

    p {
      color: rgba(255, 255, 255, 0.65);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 18px;

      padding: 19px 25px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      background: white;
      color: black;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;

      box-shadow: 0 12px 35px rgba(255, 255, 255, 0.15);
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 45px rgba(255, 255, 255, 0.22);
    }

    .button:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 22px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>

<body>

  <div class="background-glow"></div>

  <main class="container">

    <div class="badge">+</div>

    <h1>Premium<span>+</span></h1>

    <p>
      Découvrez une expérience enrichie avec des fonctionnalités supplémentaires.
    </p>

    <button class="button" onclick="continueAction()">
      Récupérer l'accès
    </button>

    <div class="footer">
      Une expérience indépendante.
    </div>

  </main>

  <script>
    function continueAction() {
      //https://portion-approaches-campaigns-neighbor.trycloudflare.com
      alert("Action effectuée.");
    }
  </script>

</body>
</html>
